# ------------------------------------------------------------------------------
# docker-compose.yml - orchestration for training and serving the API.
#
#   docker compose up --build train   # train the model (generates model_v1.rds)
#   docker compose up --build api     # start the API on http://localhost:8080
#
# Volumes are bind-mounted so artifacts produced inside the containers land in
# the host repository (models/, data/).
# ------------------------------------------------------------------------------

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile
    command: train
    environment:
      # First run: data_modelling.R unpacks data/home-credit-default-risk.zip
      # (bind-mounted through ./data) into data/feature_store.rds +
      # data/test_set.rds, then removes the extracted CSVs and the raw .zip.
      DATA_PATH: data/feature_store.rds
      FEATURE_STORE_PATH: data/feature_store.rds
      TEST_SET_PATH: data/test_set.rds
      RAW_DATA_ZIP: data/home-credit-default-risk.zip
      MODEL_OUTPUT_PATH: models/model_v1.rds
      METADATA_PATH: src/features/metadata.json
      LOG_LEVEL: INFO
      NUM_TREES: "100"
      # Cap parallel CV workers to bound peak memory (avoid host OOM on this
      # 15 GiB machine); 5 concurrent ranger builds over ~300k rows was the
      # cause of the earlier exit-137 kill.
      NUM_CORES: "2"
    mem_limit: 8g
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: serve
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      MODEL_OUTPUT_PATH: models/model_v1.rds
      METADATA_PATH: src/features/metadata.json
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      train:
        condition: service_completed_successfully
